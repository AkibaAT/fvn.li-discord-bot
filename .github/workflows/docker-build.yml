name: Build and Publish Docker Container

on:
  push:
    branches:
      - development
      - production
    tags:
      - 'v*'

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build patched test image
        run: docker build --pull --target builder -t fvnli-bot-test .

      - name: Audit dependencies and test the patched runtime
        run: docker run --rm --entrypoint sh fvnli-bot-test -c 'bun audit && bun run typecheck && bun test'

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}
          cache-from: |
            type=gha,scope=docker-cache-amd64
            type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}:buildcache-amd64
          cache-to: |
            type=gha,mode=max,scope=docker-cache-amd64
            type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}:buildcache-amd64,mode=max
          outputs: type=image,name=ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }},push-by-digest=false,push=true,name-canonical=false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set deployment variables
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          if [[ "${{ github.ref_name }}" == "production" || "${{ github.ref_name }}" == v* ]]; then
            echo "DEPLOY_PATH=${{ secrets.PROD_DEPLOY_PATH }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "development" ]]; then
            echo "DEPLOY_PATH=${{ secrets.DEV_DEPLOY_PATH }}" >> $GITHUB_ENV
          else
            echo "No deployment configured for branch ${{ github.ref_name }}"
            exit 0
          fi

      - name: Update docker-compose.yml with current image tag
        run: |
          sed -i "s|image: ghcr.io/${{ env.REPO_LOWER }}:.*|image: ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}|g" docker-compose.yml
          cat docker-compose.yml

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "${{ env.DEPLOY_PATH }}"

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Create directory if it doesn't exist
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            # Deploy
            docker compose pull
            # Only run Docker commands if NOT on development branch
            if [[ "${{ github.ref }}" != "refs/heads/development" ]]; then
              docker compose up -d
              docker compose ps
            fi
